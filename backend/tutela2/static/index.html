<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tutela 2ª instancia</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <strong>Proyección de fallos de tutela</strong>
      <small>Segunda instancia</small>
    </div>
    <div class="ajustes">
    <div class="clave">
      <label for="modelo">Modelo</label>
      <select id="modelo"></select>
    </div>
    <form id="form-key" class="clave" autocomplete="off">
      <label for="api-key">API key de Anthropic</label>
      <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off">
      <button type="submit" class="btn btn-sec">Usar</button>
      <span id="chip-key" class="chip chip-neutro" role="status">Verificando…</span>
    </form>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Pasos del caso"></nav>
  <div id="barra-caso" class="barra-caso" hidden></div>
  <main id="vista" class="contenedor"></main>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <noscript><p class="contenedor">Esta aplicación necesita JavaScript.</p></noscript>
</body>
</html>
