[project]
name = "tutela2"
version = "0.1.0"
description = "Prototipo: agente LangGraph para proyectar fallos de tutela de segunda instancia"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "anthropic>=1.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pypdfium2>=4.30", "pillow>=10"]

[project.scripts]
tutela2 = "tutela2.cli:main"
tutela2-ui = "tutela2.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutela2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not aceptacion'"
markers = ["aceptacion: pruebas sobre los casos reales de referencia/ (lentas, con OCR)"]
