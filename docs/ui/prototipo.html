<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judicabot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --fondo: #e6ebec;
  --fondo-2: #dce3e5;
  --papel: #fdfcf9;
  --tinta: #1d2a33;
  --suave: #5a6a75;
  --tenue: #8a99a2;
  --linea: #c8d1d5;
  --linea-papel: #e2ddd1;
  --acento: #1e5a6e;
  --acento-2: #174757;
  --acento-fondo: #d6e6eb;
  --sello: #7a2634;
  --sello-2: #611c28;
  --sello-fondo: #f1dde0;
  --ok: #2c6a4b;
  --ok-fondo: #d9ebe1;
  --alerta: #8f5a00;
  --alerta-fondo: #f6e8c8;
  --mal: #a8281f;
  --mal-fondo: #f5dcd9;
  --foco: #2a7fa0;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Bookman Old Style", "URW Bookman", Bookman, "Palatino Linotype", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 16px; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
a { color: var(--acento); }

.barra { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 0.75rem; padding: 0 1.5rem; height: 3.5rem; background: var(--tinta); color: #e8eef0; }
.marca { display: flex; align-items: center; gap: 0.6rem; background: none; border: 0; color: inherit; padding: 0; }
.marca svg { width: 1.9rem; height: 1.9rem; }
.marca b { font-weight: 600; font-size: 1.08rem; letter-spacing: 0.01em; }
.barra .relleno { flex: 1; }
.enlace-barra { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem; border: 0; border-radius: 6px; background: transparent; color: #c9d6db; font-size: 0.9rem; }
.enlace-barra:hover { background: #26363f; color: #fff; }
.enlace-barra[aria-current=page] { background: #2b3d47; color: #fff; }
.punto { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #6fcf9b; }
.punto.mal { background: #e8bb62; }

.lienzo { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.5rem 7rem; }
.migas { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; font-size: 0.9rem; color: var(--suave); list-style: none; padding: 0; }
.migas li + li::before { content: "/"; margin-right: 0.4rem; color: var(--tenue); }
.migas button { padding: 0; border: 0; background: none; color: var(--acento); }
.migas button:hover { text-decoration: underline; }
.titulo { font-size: 1.6rem; font-weight: 600; line-height: 1.25; }
.sub { color: var(--suave); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.55rem 1.1rem; border: 1px solid var(--linea); border-radius: 6px; background: #fff; font-weight: 500; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--acento); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn.primario:hover:not(:disabled) { background: var(--acento-2); }
.btn.sello { background: var(--sello); border-color: var(--sello); color: #fff; }
.btn.sello:hover:not(:disabled) { background: var(--sello-2); }
.btn.grande { padding: 0.75rem 1.5rem; font-size: 1.02rem; }
.btn.liviano { border-color: transparent; background: transparent; color: var(--acento); padding: 0.3rem 0.6rem; }
.btn.liviano:hover { background: var(--acento-fondo); }

.chip { display: inline-block; padding: 0.05rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 500; white-space: nowrap; background: var(--fondo-2); color: var(--suave); }
.chip.ok { background: var(--ok-fondo); color: var(--ok); }
.chip.alerta { background: var(--alerta-fondo); color: var(--alerta); }
.chip.mal { background: var(--mal-fondo); color: var(--mal); }
.chip.info { background: var(--acento-fondo); color: var(--acento); }
.chip.sello { background: var(--sello-fondo); color: var(--sello); }

input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea { width: 100%; padding: 0.5rem 0.65rem; background: #fff; border: 1px solid var(--linea); border-radius: 6px; }
textarea { resize: vertical; min-height: 4.5rem; line-height: 1.45; }
.campo { display: grid; gap: 0.3rem; align-content: start; }
.campo > label { font-size: 0.88rem; font-weight: 500; }
.campo small { color: var(--suave); font-size: 0.83rem; }

/* Inicio */
.bienvenida { max-width: 960px; margin: 2.5rem auto 0; }
.bienvenida .despacho { color: var(--suave); }
.bienvenida h1 { font-size: 2.3rem; font-weight: 600; line-height: 1.15; margin: 0.3rem 0 2rem; letter-spacing: -0.01em; }
.procesos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.proceso-t { position: relative; display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0.4rem 1.1rem; align-content: start; min-height: 10.5rem; padding: 1.4rem 1.5rem; text-align: left; border: 1px solid var(--linea); border-radius: 14px; background: #fff; }
.proceso-t .ico { grid-row: 1 / span 3; width: 3.5rem; height: 3.5rem; border-radius: 12px; display: grid; place-items: center; background: var(--acento-fondo); color: var(--acento); }
.proceso-t h2 { font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
.proceso-t p { color: var(--suave); font-size: 0.93rem; }
.proceso-t .pie-t { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1rem; margin-top: 0.8rem; font-size: 0.9rem; }
.proceso-t .pie-t .abrir { margin-left: auto; color: var(--acento); font-weight: 500; }
.proceso-t.activo { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.proceso-t.activo:hover { border-color: var(--acento); box-shadow: 0 10px 26px -18px rgba(30, 90, 110, 0.8); }
.proceso-t.inactivo { background: transparent; border-style: dashed; cursor: default; color: var(--tenue); }
.proceso-t.inactivo .ico { background: var(--fondo-2); color: var(--tenue); }
.proceso-t.inactivo h2 { color: var(--suave); font-weight: 500; }
.punto-sello { display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.35rem; border-radius: 50%; background: var(--sello); vertical-align: 0.05rem; }

/* Casos */
.cabeza-proceso { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.2rem 1rem; align-items: center; margin-bottom: 1.75rem; }
.cabeza-proceso .ico { grid-row: 1 / span 2; width: 3.2rem; height: 3.2rem; border-radius: 12px; display: grid; place-items: center; background: var(--acento-fondo); color: var(--acento); }
.nuevo-caso { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); border: 1px solid var(--linea); border-radius: 14px; background: #fff; overflow: hidden; margin-bottom: 2.5rem; }
.nuevo-caso .texto { padding: 2rem 2.2rem; display: grid; gap: 0.6rem; align-content: center; }
.nuevo-caso h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.nuevo-caso .acciones { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; margin-top: 0.6rem; }
.nuevo-caso .ilus { padding: 1.8rem 2rem; background: radial-gradient(rgba(30, 90, 110, 0.13) 1px, transparent 1.2px) 0 0 / 16px 16px, #f1f5f6; border-left: 1px solid var(--linea); display: grid; align-content: center; }
.nuevo-caso.activa { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-fondo); }
.arbol { list-style: none; margin: 0; padding: 0; font-size: 0.93rem; }
.arbol ul { list-style: none; margin: 0; padding-left: 1.3rem; border-left: 1.5px solid var(--linea); margin-left: 0.6rem; }
.arbol li { padding: 0.18rem 0; }
.arbol .n { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.55rem; border-radius: 6px; }
.arbol .n svg { flex: none; }
.arbol .objetivo > .n { background: #fff; border: 1.5px solid var(--acento); font-weight: 600; color: var(--acento); box-shadow: 0 4px 14px -8px rgba(30, 90, 110, 0.6); }
.arbol .objetivo > .n .etq { margin-left: 0.4rem; padding: 0 0.45rem; border-radius: 999px; background: var(--acento); color: #fff; font-size: 0.75rem; font-weight: 500; }
.arbol .ignorada > .n { color: var(--tenue); text-decoration: line-through; text-decoration-color: rgba(138, 153, 162, 0.6); }
.arbol .ignorada small { color: var(--tenue); display: inline-block; margin-left: 0.4rem; }
.arbol .archivos { color: var(--suave); }
.detectado { display: grid; gap: 1rem; padding: 2rem 2.2rem; }
.detectado .resumen { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; color: var(--suave); }
.soltar-global { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(30, 90, 110, 0.88); color: #fff; pointer-events: none; }
.soltar-global div { padding: 2.5rem 3rem; border: 2.5px dashed rgba(255,255,255,0.75); border-radius: 18px; text-align: center; }
.soltar-global h2 { font-size: 1.6rem; font-weight: 600; }

.herramientas { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.herramientas h2 { font-size: 1.25rem; font-weight: 600; }
.buscar { position: relative; width: min(22rem, 100%); }
.buscar svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--tenue); }
.buscar input { padding-left: 2.2rem; }
.grupo-casos { margin-bottom: 2rem; }
.grupo-casos > h3 { display: flex; align-items: baseline; gap: 0.6rem; font-size: 0.98rem; font-weight: 600; margin-bottom: 0.6rem; color: var(--suave); }
.grupo-casos > h3 span { font-weight: 400; color: var(--tenue); font-variant-numeric: tabular-nums; }
.fichas { display: grid; gap: 0.6rem; }
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) 15rem 11.5rem; gap: 1.75rem; align-items: center; padding: 1rem 1.25rem 1rem 1.4rem; background: #fff; border: 1px solid var(--linea); border-radius: 12px; position: relative; }
.ficha::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; background: var(--acento); }
.ficha.sello::before { background: var(--sello); }
.ficha.alerta::before { background: #d19a2c; }
.ficha.ok::before { background: var(--ok); }
.ficha h4 { margin: 0; font-size: 1.02rem; font-weight: 600; }
.ficha .meta { display: flex; gap: 1.2rem; margin-top: 0.15rem; font-size: 0.88rem; color: var(--suave); min-width: 0; }
.ficha .meta span { white-space: nowrap; }
.ficha .meta span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.continuar { margin-top: 2.5rem; }
.continuar h2 { font-size: 0.98rem; font-weight: 600; color: var(--suave); margin-bottom: 0.6rem; }
.avance { display: grid; gap: 0.35rem; }
.avance .seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.avance .seg4 i { height: 5px; border-radius: 3px; background: var(--fondo-2); }
.avance .seg4 i.h { background: var(--acento); }
.avance .seg4 i.a { background: var(--acento); opacity: 0.45; }
.ficha.sello .seg4 i.a { background: var(--sello); opacity: 1; }
.ficha.alerta .seg4 i.a { background: #d19a2c; opacity: 1; }
.ficha.trabajando .seg4 i.a { background: linear-gradient(90deg, var(--acento-fondo), var(--acento), var(--acento-fondo)); background-size: 200% 100%; opacity: 1; animation: barrido 1.6s linear infinite; }
@keyframes barrido { from { background-position: 200% 0; } to { background-position: 0 0; } }
.avance small { font-size: 0.86rem; color: var(--suave); }
.ficha.sello .avance small { color: var(--sello); font-weight: 500; }
.ficha.alerta .avance small { color: var(--alerta); font-weight: 500; }
.ficha .accion { display: grid; justify-items: end; gap: 0.25rem; }
.ficha .accion small { color: var(--tenue); font-size: 0.82rem; }
.ficha.compacta { padding-top: 0.7rem; padding-bottom: 0.7rem; }
.vacio-busqueda { padding: 2rem; text-align: center; color: var(--suave); border: 1px dashed var(--linea); border-radius: 12px; }

/* Caso */
.cabeza { margin-bottom: 1.5rem; }
.cabeza .meta { display: flex; flex-wrap: wrap; gap: 0.2rem 1.75rem; margin-top: 0.35rem; color: var(--suave); font-size: 0.93rem; }
.pasos { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 2rem; padding: 0; list-style: none; }
.paso { position: relative; padding-top: 1.7rem; }
.paso::before { content: ""; position: absolute; top: 0.62rem; left: 0; right: 0; height: 2px; background: var(--linea); }
.paso.hecho::before { background: var(--acento); }
.paso.actual::before { background: linear-gradient(90deg, var(--acento) 0 18%, var(--linea) 18%); }
.paso.decide.actual::before { background: linear-gradient(90deg, var(--sello) 0 18%, var(--linea) 18%); }
.paso button { all: unset; display: block; cursor: pointer; }
.paso[aria-disabled=true] button { cursor: default; }
.paso .marca-paso { position: absolute; top: 0; left: 0; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--fondo); border: 2px solid var(--linea); display: grid; place-items: center; font-size: 0.72rem; font-weight: 600; color: var(--suave); }
.paso.hecho .marca-paso { background: var(--acento); border-color: var(--acento); color: #fff; }
.paso.actual .marca-paso { border-color: var(--acento); color: var(--acento); background: #fff; }
.paso.decide.actual .marca-paso { border-color: var(--sello); color: var(--sello); }
.paso b { display: block; font-weight: 600; padding-right: 1rem; }
.paso small { color: var(--suave); font-size: 0.86rem; }
.paso[aria-disabled=true] b { color: var(--suave); font-weight: 500; }

.faltantes { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.25rem; padding: 0.8rem 1rem; border-radius: 8px; background: var(--ok-fondo); color: var(--ok); margin-bottom: 1.5rem; }
.faltantes.mal { background: var(--alerta-fondo); color: var(--alerta); }
.faltantes .piezas { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.9rem; }
.docs { background: #fff; border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
.doc { border-top: 1px solid var(--linea); }
.doc:first-child { border-top: 0; }
.doc-fila { display: grid; grid-template-columns: 2rem minmax(5rem, 1fr) 17rem 17rem 5.5rem; gap: 0.9rem; align-items: center; padding: 0.7rem 1rem; }
.doc-fila .nombre b { display: block; font-weight: 500; }
.doc-fila .nombre small { color: var(--suave); }
.icono-pdf { width: 1.5rem; height: 1.9rem; }
.rol { padding: 0.35rem 0.5rem; border-color: transparent; background: var(--fondo); font-weight: 500; }
.rol:hover { border-color: var(--linea); }
.rol.cambiado { background: var(--acento-fondo); }
.jev { font-size: 0.85rem; color: var(--suave); }
.jev .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
.jev.alto .pct { color: var(--ok); }
.jev.discrepa { color: var(--alerta); }
.expandir { all: unset; display: inline-flex; align-items: center; justify-content: flex-end; gap: 0.3rem; height: 1.8rem; padding: 0 0.4rem; cursor: pointer; border-radius: 4px; color: var(--tenue); font-size: 0.82rem; }
.expandir:hover { color: var(--acento); }
.expandir:hover { background: var(--fondo); }
.expandir svg { transition: transform 0.15s; }
.doc.abierto .expandir svg { transform: rotate(90deg); }
.doc-detalle { padding: 0 1rem 1rem 3.9rem; color: var(--suave); font-size: 0.92rem; }
.doc-detalle q { display: block; padding: 0.6rem 0.9rem; border-left: 3px solid var(--linea); background: var(--fondo); quotes: none; font-style: italic; }
.doc-detalle .alerta-doc { margin-top: 0.5rem; color: var(--alerta); }
.bloque { margin-top: 2rem; }
.bloque > h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.2rem; }
.bloque > .sub { margin-bottom: 0.9rem; font-size: 0.92rem; }
.rejilla-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.salidas-previas { display: grid; gap: 0.5rem; }
.fila-archivo { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 0.8rem; align-items: center; padding: 0.55rem 0.8rem; background: #fff; border: 1px solid var(--linea); border-radius: 8px; }
.fila-archivo small { display: block; color: var(--suave); }
.accion-fija { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(230, 235, 236, 0.94); border-top: 1px solid var(--linea); backdrop-filter: blur(6px); }
.accion-fija > div { max-width: 1180px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
.accion-fija .relleno { flex: 1; color: var(--suave); font-size: 0.92rem; }
.accion-fija .relleno b { color: var(--tinta); font-weight: 500; }

.proceso { max-width: 640px; margin: 1rem auto 0; }
.proceso h2 { font-size: 1.35rem; font-weight: 600; }
.etapas { list-style: none; margin: 1.5rem 0; padding: 0; display: grid; }
.etapa { display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 0.9rem; align-items: start; padding: 0.9rem 0; border-top: 1px solid var(--linea); }
.etapa:last-child { border-bottom: 1px solid var(--linea); }
.etapa b { font-weight: 500; }
.etapa small { display: block; color: var(--suave); }
.etapa.espera { color: var(--suave); }
.giro { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 2px solid var(--acento-fondo); border-top-color: var(--acento); animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.hecho-ico { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
.espera-ico { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 2px solid var(--linea); }

.dos { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 2rem; align-items: start; }
.dos.ancha { grid-template-columns: minmax(0, 1fr) 27rem; }
.dos.fmt { grid-template-columns: minmax(0, 1fr) 30rem; gap: 2.5rem; }
.hoja { background: var(--papel); border: 1px solid var(--linea-papel); border-radius: 3px; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 10px 30px -18px rgba(29, 42, 51, 0.35); padding: 3rem 3.4rem; font-family: var(--serif); font-size: 1.02rem; line-height: 1.75; hyphens: auto; }
.hoja .sello-borrador { display: inline-block; margin-bottom: 1.6rem; padding: 0.1rem 0.7rem; border: 1.5px solid var(--sello); border-radius: 3px; color: var(--sello); font-family: var(--sans); font-size: 0.82rem; font-weight: 600; transform: rotate(-1.2deg); }
.hoja h3 { margin: 2rem 0 0.7rem; font-size: 1.02rem; font-weight: 700; }
.hoja h3:first-of-type { margin-top: 0; }
.hoja p { margin-bottom: 0.9rem; text-align: justify; }
.hoja .nota-edit { font-family: var(--sans); font-size: 0.85rem; color: var(--suave); }
.cita { padding: 0 0.15rem; border: 0; border-bottom: 2px solid; border-radius: 2px 2px 0 0; background: none; font: inherit; line-height: inherit; color: inherit; }
.cita.ok { border-color: #5fa882; background: rgba(44, 106, 75, 0.09); }
.cita.alerta { border-color: #d19a2c; background: rgba(143, 90, 0, 0.12); }
.cita.rechazada { border-color: var(--mal); background: rgba(168, 40, 31, 0.12); }
.cita:hover, .cita.sel { background: var(--acento-fondo); }
.riel { position: sticky; top: 4.8rem; display: grid; gap: 1.5rem; max-height: calc(100vh - 6.5rem); overflow: auto; padding-right: 0.2rem; }
.riel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
.riel section { padding-bottom: 1.25rem; border-bottom: 1px solid var(--linea); }
.riel section:last-child { border-bottom: 0; }

.contexto { display: flex; flex-wrap: wrap; gap: 0.3rem 2.5rem; margin-bottom: 1.75rem; padding: 0.9rem 1.1rem; border-left: 4px solid var(--sello); background: #fff; border-radius: 0 8px 8px 0; font-size: 0.93rem; }

.opciones { display: grid; gap: 0.5rem; }

.hijo { margin-top: 1.1rem; }
.reparo { display: grid; grid-template-columns: minmax(0, 1fr) 11rem; gap: 0.4rem 1rem; align-items: start; padding: 0.8rem 0; border-top: 1px solid var(--linea); }

.orden-card { display: grid; gap: 0.8rem; padding: 1rem; margin-bottom: 0.8rem; background: #fff; border: 1px solid var(--linea); border-radius: 10px; }
.orden-card .fila { display: grid; grid-template-columns: minmax(0, 1fr) 6rem 9rem; gap: 0.8rem; }

.fila-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
.hoja-resuelve { position: sticky; top: 4.8rem; max-height: calc(100vh - 6rem); overflow: auto; padding: 2rem 1.8rem 1.4rem; font-size: 0.9rem; line-height: 1.6; }

.hero-fallo { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 2.2rem; align-items: center; padding: 1.8rem 2rem; border: 1px solid var(--linea); border-radius: 12px; background: #fff; }

.antes-firmar { margin: 1.5rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
.antes-firmar li { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; font-size: 0.93rem; align-items: start; }

.grupo-salida { margin-top: 2rem; }

/* Formato */
.form-fmt { display: grid; gap: 2.4rem; }

.previa { position: sticky; top: 4.8rem; display: grid; gap: 0.8rem; }

.pagina { background: var(--papel); border: 1px solid var(--linea-papel); box-shadow: 0 10px 30px -18px rgba(29, 42, 51, 0.45); font-family: var(--serif); color: #23272a; font-size: 0.62rem; line-height: 1.55; padding: 2rem 2.2rem 1.2rem; display: flex; flex-direction: column; margin-bottom: 0.9rem; }

.pagina .logo-ph { width: 6.5rem; height: 2.1rem; margin: 0 auto 0.9rem; border: 1px dashed #cfc8b6; display: grid; place-items: center; font-family: var(--sans); font-size: 0.6rem; color: var(--tenue); }
.pagina .tabla-p { width: 70%; border-collapse: collapse; margin: 0.4rem 0 0.9rem; font-size: 0.56rem; }
.pagina .tabla-p td { border: 0.5px solid #555; padding: 0.05rem 0.3rem; }
.pagina .tabla-p td:first-child { font-weight: 700; width: 35%; }

.pagina .pie-p { margin-top: 1.2rem; text-align: center; font-size: 0.5rem; line-height: 1.4; }

.toast { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%); z-index: 60; padding: 0.6rem 1.1rem; border-radius: 8px; background: var(--tinta); color: #fff; font-size: 0.92rem; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }

/* IA */
.ia { max-width: 760px; }
.ia .sec-fmt { padding-top: 2rem; margin-top: 2rem; border-top: 1px solid var(--linea); }

/* Proceso */

.tz-t { color: var(--tenue); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.tz-k { justify-self: start; padding: 0 0.5rem; border-radius: 999px; font-size: 0.76rem; font-weight: 500; background: var(--fondo-2); color: var(--suave); }
.tz-razona .tz-k { background: var(--acento-fondo); color: var(--acento); }
.tz-razona .tz-x { font-style: italic; padding-left: 0.7rem; border-left: 2px solid var(--acento-fondo); color: #2c3e48; }
.tz-escribe .tz-k { background: var(--sello-fondo); color: var(--sello); }
.tz-verifica .tz-k { background: var(--ok-fondo); color: var(--ok); }
.cursor { display: inline-block; width: 0.5rem; height: 1em; margin-left: 2px; vertical-align: -0.12em; background: var(--acento); animation: parpadeo 1s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }
.tz-nota { margin-top: 1rem; color: var(--tenue); font-size: 0.83rem; }
.tz-fin { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-top: 1.4rem; padding: 1rem 1.2rem; border-radius: 10px; background: var(--ok-fondo); color: var(--ok); }

/* Borrador largo */
.hoja { scroll-margin-top: 5rem; }
.hoja h3[id] { scroll-margin-top: 5rem; }
.hoja h4 { margin: 1.4rem 0 0.5rem; font-size: 1rem; font-weight: 700; font-style: italic; }
.hoja .tabla-h { width: 78%; border-collapse: collapse; margin: 0 0 1.8rem; font-size: 0.9rem; line-height: 1.45; }
.hoja .tabla-h td { border: 0.5px solid #555; padding: 0.1rem 0.5rem; vertical-align: top; }
.hoja .tabla-h td:first-child { font-weight: 700; width: 28%; }
.hoja .cabecera-h { text-align: center; font-weight: 700; margin-bottom: 0.4rem; }
.hoja .fecha-h { text-align: center; margin-bottom: 1.2rem; }
.hoja blockquote { margin: 0 0 0.9rem 1.6rem; padding: 0; text-align: justify; font-size: 0.97rem; }
.hoja.origen .tpl { background: rgba(30, 90, 110, 0.09); box-shadow: -0.5rem 0 0 rgba(30, 90, 110, 0.09), 0.5rem 0 0 rgba(30, 90, 110, 0.09); border-radius: 2px; }
.indice { display: grid; gap: 0.1rem; margin: 0; padding: 0; list-style: none; }

.indice .sub-i { padding-left: 1.2rem; color: var(--suave); font-size: 0.86rem; }
.leyenda-origen { display: inline-block; width: 0.8rem; height: 0.8rem; margin-right: 0.4rem; border-radius: 2px; background: rgba(30, 90, 110, 0.18); vertical-align: -0.1rem; }
.interr.chica { padding: 0.2rem 0; font-size: 0.92rem; }

/* Fallo final */
.dos.res { grid-template-columns: minmax(0, 1fr) 22rem; gap: 2.5rem; }
.visor-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.4rem 1rem; max-width: 40rem; margin: 0 auto 0.9rem; }
.visor-bar h2 { font-size: 1.1rem; font-weight: 600; }
.visor-bar span { color: var(--suave); font-size: 0.88rem; }
.visor { display: grid; gap: 1.2rem; justify-items: center; }
.pag-fallo { width: 100%; max-width: 40rem; aspect-ratio: 21.1 / 34.1; display: flex; flex-direction: column; padding: 3.1rem 3.4rem 1.6rem; background: var(--papel); border: 1px solid var(--linea-papel); box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 18px 40px -26px rgba(29, 42, 51, 0.5); font-family: var(--serif); font-size: 0.8rem; line-height: 1.6; color: #23272a; }
.pag-fallo .cuerpo-f { flex: 1; }
.pag-fallo p { margin: 0 0 0.7rem; text-align: justify; }
.pag-fallo .c { text-align: center; }
.pag-fallo .n { font-weight: 700; }
.pag-fallo .tit { margin: 1.2rem 0 0.7rem; text-align: center; font-weight: 700; }
.pag-fallo .sub-f { margin: 1rem 0 0.4rem; font-weight: 700; }
.pag-fallo blockquote { margin: 0 0 0.7rem 1.4rem; text-align: justify; font-size: 0.77rem; }
.pag-fallo .logo-f { display: block; height: 2.6rem; margin: 0 auto 1.1rem; }
.pag-fallo .logo-ph { width: 8rem; height: 2.6rem; margin: 0 auto 1.1rem; border: 1px dashed #cfc8b6; display: grid; place-items: center; font-family: var(--sans); font-size: 0.7rem; color: var(--tenue); }
.pag-fallo table { border-collapse: collapse; width: 82%; margin: 0.6rem 0 1rem; font-size: 0.76rem; }
.pag-fallo td { border: 0.5px solid #555; padding: 0.05rem 0.4rem; vertical-align: top; }
.pag-fallo td:first-child { font-weight: 700; width: 26%; }
.pag-fallo .pie-f { margin-top: 0.8rem; text-align: center; font-size: 0.66rem; line-height: 1.4; font-style: italic; }
.pag-fallo .num-f { text-align: right; font-size: 0.7rem; font-family: var(--sans); color: #555; margin-top: 0.5rem; }
.res-lat { position: sticky; top: 4.8rem; display: grid; gap: 1.4rem; }
.res-lat h2 { font-size: 1.3rem; font-weight: 600; margin: 0.4rem 0 0.2rem; }
.res-lat .acciones { display: grid; gap: 0.6rem; margin-top: 1rem; }
.otros { display: grid; gap: 0.3rem; }
.otros h3 { font-size: 0.95rem; font-weight: 600; margin: 0.9rem 0 0.1rem; color: var(--suave); }
.otro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; padding: 0.35rem 0; border-bottom: 1px solid var(--linea); font-size: 0.9rem; }
.otro small { display: block; color: var(--tenue); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.otro .btn { padding: 0.25rem 0.7rem; font-size: 0.85rem; }

dialog { max-width: 30rem; border: 0; border-radius: 12px; padding: 1.6rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
dialog::backdrop { background: rgba(20, 30, 36, 0.5); }

dialog .acciones { display: flex; gap: 0.7rem; justify-content: flex-end; margin-top: 1.3rem; }

.proto { position: fixed; left: 0.8rem; bottom: 5rem; z-index: 40; font-size: 0.8rem; }
.proto details { background: #fff; border: 1px solid var(--linea); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.proto summary { padding: 0.35rem 0.7rem; cursor: pointer; color: var(--suave); }
.proto div { display: grid; padding: 0.3rem 0.4rem 0.5rem; }

      <div class="tarjetas-op">
        ${op('modelo', 'Sonnet 5.5', ia.modelo, 'Sonnet 5.5', 'Recomendado. Equilibrio entre calidad, tiempo y costo.')}
        ${op('modelo', 'Opus 5.5', ia.modelo, 'Opus 5.5', 'El más cuidadoso. Más lento y más costoso.')}
        ${op('modelo', 'Haiku 5.5', ia.modelo, 'Haiku 5.5', 'El más rápido. Si rechaza una tarea, se reintenta con Sonnet.')}
      </div>
    </section>
    <section class="sec-fmt">
      <h2>Clave de Anthropic</h2>
      <p class="sub">Vive solo en la memoria del servidor: no se guarda en disco y se pierde al reiniciarlo.</p>
      <div class="estado-clave" style="margin-bottom:.7rem"><span class="punto ${ia.clave ? '' : 'mal'}"></span>${ia.clave ? 'Hay una clave lista.' : 'No hay clave. Sin ella no se puede redactar.'}</div>
      <div style="display:flex;gap:.6rem;max-width:32rem"><input type="password" id="clave" placeholder="sk-ant-…" autocomplete="off" aria-label="Clave de Anthropic"><button class="btn" data-accion="usar-clave">${ia.clave ? 'Reemplazar' : 'Usar clave'}</button></div>
    </section>
    <section class="sec-fmt">
      <h2>Jev, segunda opinión</h2>
      <p class="sub">Verifica los roles de los documentos y los datos del fallo de primera instancia. Nunca decide el sentido del fallo.</p>
      <div class="tarjetas-op">
        ${op('jev', 'apagado', ia.jev, 'Apagado', 'No sale ninguna petición.')}
        ${op('jev', 'sombra', ia.jev, 'Sombra', 'Opina y deja alertas. No cambia nada.')}
        ${op('jev', 'relleno', ia.jev, 'Relleno', 'Además asigna el rol de documentos que quedaron como «Otro».')}
      </div>
      ${ia.jev !== 'apagado' ? `<p class="nota-priv" style="margin-top:1rem">Con Jev encendido se envían a TypeSafe AI fragmentos del expediente: la cabecera de cada documento y la cola del fallo de primera instancia, nunca el expediente completo. Antes de usarlo con casos reales, confirme que sus términos cumplen el artículo 8.6 del Acuerdo PCSJA24-12243.</p>
      <div style="display:flex;gap:.6rem;max-width:32rem;margin-top:1rem"><input type="password" placeholder="Clave de Jev" aria-label="Clave de Jev"><button class="btn" data-accion="usar-clave-jev">Usar clave</button></div>` : ''}
    </section>
    <section class="sec-fmt">
      <details class="avanzado"><summary>Opciones avanzadas</summary>
        <div class="campos">
          <div class="campo"><label>Esfuerzo de razonamiento</label><select><option>high</option><option>xhigh</option><option>max</option><option>medium</option><option>low</option></select></div>
          <div class="campo"><label>Máximo de tokens de salida</label><input type="number" value="64000"><small>Súbalo si una respuesta se corta.</small></div>
          <div class="campo"><label>Reintentos por llamada</label><input type="number" value="1"></div>
          <div class="campo"><label>Instrucciones del modelo</label><button class="btn" style="justify-self:start">Editar instrucciones</button></div>
        </div>
      </details>
    </section>
  </div>`;
}

/* ---------- Render ---------- */
const VISTAS = { inicio: vistaInicio, casos: vistaCasos, docs: vistaDocs, redaccion: vistaRedaccion, draft: vistaDraft, decision: vistaDecision, enviando: vistaEnviando, result: vistaResult, formato: vistaFormato, ia: vistaIA };
const ACCIONES = { docs: accionDocs, draft: accionDraft, decision: accionDecision };
function render() {
  const y = window.scrollY;
  $('#vista').innerHTML = VISTAS[S.vista]();
  $('#accion').innerHTML = (ACCIONES[S.vista] || (() => ''))();
  $('#capa').innerHTML = S.arrastrando ? '<div class="soltar-global"><div><h2>Suelte la carpeta</h2><p>Se creará un caso nuevo con ella.</p></div></div>' : '';
  $('#txt-ia').textContent = S.ia.clave ? S.ia.modelo : `${S.ia.modelo}, sin clave`;
  $('#punto-clave').className = 'punto' + (S.ia.clave ? '' : ' mal');
  $('#nav-formato').removeAttribute('aria-current');
  $('#nav-ia').removeAttribute('aria-current');
  if (S.vista === 'formato') { $('#nav-formato').setAttribute('aria-current', 'page'); pintarPrevia(); }
  if (S.vista === 'ia') $('#nav-ia').setAttribute('aria-current', 'page');
  if (S.vista === 'decision') { ultimasClaves = numerales().map((x) => x.k); pintarHoja(); }
  window.scrollTo(0, y);
}
function ir(vista) {
  if (vista === 'result' && S.vista === 'decision') vista = 'enviando';
  if (S.vista === 'formato' && vista !== 'formato') {
    if (fmtSucio() && !confirm('Hay cambios de formato sin guardar. ¿Salir sin guardarlos?')) return;
    S.fmt = { ...S.fmtGuardado };
  }
  S.vista = vista; S.citaSel = null; S.fmtFoco = null;
  render(); window.scrollTo(0, 0);
  if (vista === 'enviando' || vista === 'redaccion') iniciarTraza(vista);
}
function cambiar(vista) { S.vista = vista; render(); window.scrollTo(0, 0); }
function aviso(texto) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = texto;
  document.body.append(t); setTimeout(() => t.remove(), 2200);
}
function pedirClave() {
  const dl = $('#dialogo');
  dl.innerHTML = `<h2>Falta la clave de Anthropic</h2><p class="sub">Sin ella no se puede redactar. Vive solo en la memoria del servidor.</p><div class="campo" style="margin-top:1rem"><label for="clave-dl">Clave</label><input id="clave-dl" type="password" placeholder="sk-ant-…" autocomplete="off"></div><div class="acciones"><button class="btn" id="d-no">Cancelar</button><button class="btn primario" id="d-si">Usar clave e iniciar</button></div>`;
  dl.showModal(); $('#clave-dl').focus();
  $('#d-no').onclick = () => dl.close();
  $('#d-si').onclick = () => { if (!$('#clave-dl').value.trim()) return $('#clave-dl').focus(); S.ia.clave = true; dl.close(); ir('redaccion'); };
}
function confirmarEnvio() {
  const dl = $('#dialogo'); const d = S.dec;
  dl.innerHTML = `<h2>Enviar su decisión</h2><p>Se redactará el caso concreto con esta decisión (<b>${d.resultado}${d.sust ? ', ' + d.sust : ''}</b>) y se generarán el fallo y los documentos de apoyo.</p><p class="sub" style="margin-top:.5rem">Usará ${esc(S.ia.modelo)}.</p><div class="acciones"><button class="btn" id="d-no">Seguir editando</button><button class="btn sello" id="d-si">Enviar y redactar</button></div>`;
  dl.showModal();
  $('#d-no').onclick = () => dl.close();
  $('#d-si').onclick = () => { dl.close(); ir('result'); };
}
function agregarOrden() { S.dec.ordenes.push({ dest: '', n: 48, u: 'horas_habiles', conducta: '', via: true }); }
function carpetaLista() { S.detectado = { n: 9, nombre: 'Carpeta 01PrimeraInstancia' }; }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-ir], [data-accion]');
  if (!t) return;
  if (t.dataset.etapa !== undefined && tz) { tz.sel = t.dataset.etapa === '' ? null : +t.dataset.etapa; return pintarTraza(true); }
  if (t.dataset.ancla) { const el = document.getElementById(t.dataset.ancla); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.ir) { if (t.closest('.proto')) t.closest('details').open = false; return ir(t.dataset.ir); }
  if (t.dataset.abrir) { S.abiertos.has(t.dataset.abrir) ? S.abiertos.delete(t.dataset.abrir) : S.abiertos.add(t.dataset.abrir); return render(); }
  if (t.dataset.aceptar) { S.roles[t.dataset.aceptar] = DOCS.find((d) => d.n === t.dataset.aceptar).jev[0]; return render(); }
  if (t.dataset.cita !== undefined) { S.citaSel = t.dataset.cita || null; return render(); }
  if (t.dataset.seg === 'resultado') { S.dec.resultado = t.dataset.v; if (t.dataset.v === 'CONFIRMAR') S.dec.sust = ''; return sincronizarDecision(); }
  if (t.dataset.sust) { S.dec.sust = t.dataset.sust; if (t.dataset.sust === 'AMPARAR' && !S.dec.ordenes.length) { agregarOrden(); $('#lista-ordenes').innerHTML = S.dec.ordenes.map(ordenCard).join(''); } return sincronizarDecision(); }
  if (t.dataset.mover) { const i = +t.dataset.mover, dir = +t.dataset.dir; const claves = numerales().map((x) => x.k); const j = i + dir; if (j < 0 || j >= claves.length) return; [claves[i], claves[j]] = [claves[j], claves[i]]; S.dec.orden = claves; return pintarHoja(); }
  if (t.dataset.quitarOrden !== undefined) { S.dec.ordenes.splice(+t.dataset.quitarOrden, 1); $('#lista-ordenes').innerHTML = S.dec.ordenes.map(ordenCard).join(''); return pintarHoja(); }
  if (t.dataset.fdoc) { S.fmtDoc = t.dataset.fdoc; if (t.dataset.desde) S.fmtFoco = t.dataset.desde; return pintarPrevia(); }
  if (t.dataset.gen) { S.fmt.gen = t.dataset.gen; S.fmtDoc = 'fallo'; S.fmtFoco = null; document.querySelectorAll('[data-gen]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.gen === S.fmt.gen))); return pintarPrevia(); }
  if (t.dataset.modelo) { S.ia.modelo = t.dataset.modelo; aviso(`Modelo: ${S.ia.modelo}`); return render(); }
  if (t.dataset.jev) { S.ia.jev = t.dataset.jev; return render(); }
  switch (t.dataset.accion) {
    case 'elegir': carpetaLista(); return render();
    case 'cancelar-soltar': S.detectado = null; return render();
    case 'guardar-roles': DOCS.forEach((d) => { d.rol = S.roles[d.n]; }); aviso('Cambios guardados'); return render();
    case 'redactar': return S.ia.clave ? ir('redaccion') : pedirClave();
    case 'abrir-rehacer': S.rehacer = true; return render();
    case 'rehacer': S.rehacer = false; return ir('redaccion');
    case 'agregar-orden': agregarOrden(); $('#lista-ordenes').innerHTML = S.dec.ordenes.map(ordenCard).join(''); return pintarHoja();
    case 'agregar-libre': S.dec.libres.push(''); $('#lista-libres').innerHTML = S.dec.libres.map(libreHtml).join(''); return pintarHoja();
    case 'enviar-decision': return confirmarEnvio();
    case 'traza-fin': { const destino = tz.tipo === 'redaccion' ? 'draft' : 'result'; tz = null; clearInterval(temporizador); return cambiar(destino); }
    case 'guardar-fmt': S.fmtGuardado = { ...S.fmt }; aviso('Formato guardado'); return pintarPrevia();
    case 'descartar-fmt': S.fmt = { ...S.fmtGuardado }; S.fmtFoco = null; return render();
    case 'usar-clave': if ($('#clave').value.trim()) { S.ia.clave = true; aviso('Clave lista'); render(); } else $('#clave').focus(); return;
    case 'usar-clave-jev': aviso('Clave de Jev lista'); return;
  }
});
document.addEventListener('focusin', (e) => {
  const k = e.target.dataset?.fmt;
  if (!k) return;
  const f = SECCIONES_FMT.flatMap((s) => s.campos).find((x) => x.k === k);
  S.fmtFoco = k;
  if (!f.docs.includes(S.fmtDoc) && PREVIAS[f.docs[0]]) S.fmtDoc = f.docs[0];
  pintarPrevia();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.fmt) { S.fmt[t.dataset.fmt] = t.value; return pintarPrevia(); }
  if (t.id === 'buscar') { S.buscar = t.value; $('#lista-casos').innerHTML = listaCasos(); return; }
  if (t.id === 'eje') S.dec.eje = t.value;
  else if (t.id === 'por') S.dec.por = t.value;
  else if (t.id === 'fecha') S.dec.fecha = t.value;
  else if (t.id === 'desv') S.dec.desvincular = t.value;
  else if (t.id === 'prev') S.dec.prevenir = t.value;
  else if (t.id === 'compulsa-a') S.dec.compulsaA = t.value;
  else if (t.dataset.libre !== undefined) S.dec.libres[+t.dataset.libre] = t.value;
  else if (t.dataset.of) { const o = S.dec.ordenes[+t.closest('[data-orden]').dataset.orden]; const k = t.dataset.of; o[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value; }
  else if (t.dataset.reparoNota) { (S.dec.reparos[t.dataset.reparoNota] ||= { d: 'ACOGE' }).nota = t.value; return; }
  else return;
  if (S.vista === 'decision') pintarHoja();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.accion === 'origen') { S.origen = t.checked; return render(); }
  if (t.dataset.rol) { S.roles[t.dataset.rol] = t.value; return render(); }
  if (t.dataset.chk) { S.dec[t.dataset.chk] = t.checked; return sincronizarDecision(); }
  if (t.dataset.reparo) { (S.dec.reparos[t.dataset.reparo] ||= {}).d = t.value; return; }
  if (t.dataset.derecho !== undefined) { S.dec.derechos[+t.dataset.derecho].d = t.value; return pintarHoja(); }
  if (t.dataset.of) { const o = S.dec.ordenes[+t.closest('[data-orden]').dataset.orden]; o[t.dataset.of] = t.type === 'checkbox' ? t.checked : t.value; return pintarHoja(); }
});
let profundidad = 0;
document.addEventListener('dragenter', (e) => { if (S.vista !== 'casos') return; e.preventDefault(); profundidad++; if (!S.arrastrando) { S.arrastrando = true; $('#capa').innerHTML = '<div class="soltar-global"><div><h2>Suelte la carpeta</h2><p>Se creará un caso nuevo con ella.</p></div></div>'; } });
document.addEventListener('dragover', (e) => { if (S.vista === 'casos') e.preventDefault(); });
document.addEventListener('dragleave', () => { if (S.vista !== 'casos') return; profundidad = Math.max(0, profundidad - 1); if (!profundidad && S.arrastrando) { S.arrastrando = false; $('#capa').innerHTML = ''; } });
document.addEventListener('drop', (e) => { if (S.vista !== 'casos') return; e.preventDefault(); profundidad = 0; S.arrastrando = false; carpetaLista(); render(); });
window.addEventListener('beforeunload', (e) => { if (S.vista === 'formato' && fmtSucio()) e.preventDefault(); });

(() => {
  const h = location.hash.slice(1);
  if (h === 'decision-lleno') {
    Object.assign(S.dec, { resultado: 'REVOCAR', sust: 'AMPARAR', eje: 'El a quo omitió valorar la orden médica vigente; la EPS suspendió el tratamiento sin justificación.' });
    S.dec.ordenes.push({ dest: 'la EPS HORIZONTE SALUD S.A.S.', n: 48, u: 'horas_habiles', conducta: 'autorice y entregue el medicamento prescrito, sin dilaciones', via: true });
    S.vista = 'decision';
  } else if (h === 'formato-foco') { S.vista = 'formato'; S.fmtFoco = 'juez'; S.fmtDoc = 'fallo'; }
  else if (h === 'formato-auto') { S.vista = 'formato'; S.fmtDoc = 'auto'; S.fmtFoco = 'escribiente'; S.fmt.escribiente = 'Laura Camila Ospina Ríos'; }
  else if (h === 'casos-listo') { S.vista = 'casos'; carpetaLista(); }
  else if (h === 'ia-jev') { S.vista = 'ia'; S.ia.jev = 'sombra'; }
  else if (VISTAS[h]) S.vista = h;
  else if (h === 'traza-mitad') S.vista = 'redaccion';
  else if (h === 'draft-origen') { S.vista = 'draft'; S.origen = true; }
})();
render();
if (['redaccion', 'enviando'].includes(S.vista)) { iniciarTraza(S.vista); if (location.hash === '#traza-mitad') adelantarTraza(2, 3); }
</script>
</body>
</html>
